name: Build Windows native release

on:
  workflow_dispatch:
    inputs:
      host_url:
        description: 'Native host release ZIP URL (artifact-only override)'
        type: string
      host_sha256:
        description: 'Exact host ZIP SHA-256'
        type: string
      host_source_url:
        description: 'Matching host source ZIP URL'
        type: string
      host_source_sha256:
        description: 'Exact host source ZIP SHA-256'
        type: string
      host_revision:
        description: 'Full native host commit SHA'
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14.3'
  UV_VERSION: '0.10.9'

jobs:
  package:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '${{ env.UV_VERSION }}'
          enable-cache: false
      - name: Resolve native host pin
        shell: pwsh
        env:
          PREVIEW_URL: ${{ inputs.host_url }}
          PREVIEW_SHA256: ${{ inputs.host_sha256 }}
          PREVIEW_SOURCE_URL: ${{ inputs.host_source_url }}
          PREVIEW_SOURCE_SHA256: ${{ inputs.host_source_sha256 }}
          PREVIEW_REVISION: ${{ inputs.host_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content .github/release-host.json -Raw | ConvertFrom-Json
          if ($env:PREVIEW_URL) {
            $pin.url = $env:PREVIEW_URL
            $pin.sha256 = $env:PREVIEW_SHA256
            $pin.revision = $env:PREVIEW_REVISION
            $pin.source_url = $env:PREVIEW_SOURCE_URL
            $pin.source_sha256 = $env:PREVIEW_SOURCE_SHA256
          }
          if ($pin.sha256 -notmatch '^[0-9a-f]{64}$' -or $pin.revision -notmatch '^[0-9a-f]{40}$') {
            throw 'Pin a native host release URL, SHA-256, and full revision; the Python v0.2.1 host is incompatible.'
          }
          if ($pin.url -notmatch '^https://github.com/furious-pixel/dosbox-x-mod/releases/download/') {
            throw 'Expected a dosbox-x-mod release asset URL.'
          }
          Invoke-WebRequest -Uri $pin.url -OutFile host.zip
          if ((Get-FileHash host.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) {
            throw 'Host archive checksum mismatch'
          }
          if ($pin.source_sha256 -notmatch '^[0-9a-f]{64}$' -or $pin.source_url -notmatch '^https://github.com/furious-pixel/dosbox-x-mod/releases/download/') {
            throw 'Pin the matching host source ZIP and checksum'
          }
          Invoke-WebRequest -Uri $pin.source_url -OutFile host-source.zip
          if ((Get-FileHash host-source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.source_sha256) {
            throw 'Host source archive checksum mismatch'
          }
          Expand-Archive host-source.zip -DestinationPath host-source-check
          Expand-Archive host.zip -DestinationPath host-input
          $hosts = @(Get-ChildItem host-input -Recurse -Filter dosbox-x.exe)
          if ($hosts.Count -ne 1) { throw 'Expected one host executable' }
          $manifest = Get-Content (Join-Path $hosts[0].Directory.FullName 'HOST_BUILD_INFO.json') -Raw | ConvertFrom-Json
          if ($manifest.revision -ne $pin.revision -or @($manifest.worktree_changes).Count -ne 0) {
            throw 'Host archive must come from the pinned clean source revision'
          }
          if ($manifest.executable_sha256 -ne (Get-FileHash $hosts[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw 'Host executable checksum does not match its manifest'
          }
          $sourceManifest = Get-Content host-source-check/HOST_BUILD_INFO.json -Raw | ConvertFrom-Json
          if ($sourceManifest.revision -ne $manifest.revision -or $sourceManifest.executable_sha256 -ne $manifest.executable_sha256) {
            throw 'Host source and binary manifests disagree'
          }
          if ($manifest.generated_header_sha256 -ne (Get-FileHash host-source-check/include/build_timestamp.h -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw 'Host generated build header mismatch'
          }
          "HOST_ROOT=$($hosts[0].Directory.FullName)" >> $env:GITHUB_ENV
          "HOST_REVISION=$($pin.revision)" >> $env:GITHUB_ENV
      - name: Prepare locked Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv python install $env:PYTHON_VERSION --install-dir "$env:RUNNER_TEMP/python" --managed-python --no-bin --no-registry
          if ($LASTEXITCODE) { throw 'Python installation failed' }
          $bases = @(Get-ChildItem "$env:RUNNER_TEMP/python" -Recurse -Filter python.exe |
            Where-Object { Test-Path (Join-Path $_.Directory.FullName 'python314.dll') })
          if ($bases.Count -ne 1) { throw 'Expected one Python runtime' }
          uv sync --frozen --python $bases[0].FullName
          if ($LASTEXITCODE) { throw 'Dependency installation failed' }
          "PYTHON_HOME=$($bases[0].Directory.FullName)" >> $env:GITHUB_ENV
      - name: Build and stage native renderer
        shell: pwsh
        run: |
          ./tools/run_clean_env.ps1 -FilePath cmake -CommandLine '--preset windows-msvc -S src/mw2renderer'
          if ($LASTEXITCODE) { throw 'Configure failed' }
          ./tools/run_clean_env.ps1 -FilePath cmake -CommandLine '--build src/mw2renderer/build --config Release --target mw2renderer'
          if ($LASTEXITCODE) { throw 'Build failed' }
          cmake --install src/mw2renderer/build --config Release --component Runtime --prefix native-runtime
          if ($LASTEXITCODE) { throw 'Runtime staging failed' }
      - name: Assemble player package and corresponding source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Version/tag mismatch' }
          & .venv/Scripts/python.exe -B tools/package_release.py --runtime-stage native-runtime --host-root "$env:HOST_ROOT" --host-revision "$env:HOST_REVISION" --venv .venv --python-home "$env:PYTHON_HOME" --output dist
          if ($LASTEXITCODE) { throw 'Package assembly failed' }
          New-Item -ItemType Directory source-stage | Out-Null
          git archive --format=tar --output=project-source.tar HEAD
          if ($LASTEXITCODE) { throw 'Source archive failed' }
          tar -xf project-source.tar -C source-stage
          if ($LASTEXITCODE) { throw 'Source extraction failed' }
          cmake --install src/mw2renderer/build --config Release --component DependencySource --prefix source-stage
          if ($LASTEXITCODE) { throw 'Dependency source staging failed' }
          Copy-Item host-source.zip source-stage/dosbox-x-source.zip
          $source = "dist/mw2-enhanced-renderer-mod-v$version-source.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $PWD 'source-stage'), (Join-Path $PWD $source))
          "$((Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path $source -Leaf)" | Set-Content "$source.sha256" -Encoding ascii
          Push-Location "dist/mw2-enhanced-renderer-mod-v$version-windows-x64"
          try {
            & .venv/Scripts/python.exe -I -B -c "import pathlib,sys; assert pathlib.Path(sys.base_prefix).resolve().is_relative_to(pathlib.Path.cwd()/'.venv'); import sdl2,webview; print(sys.version)"
            if ($LASTEXITCODE) { throw 'Portable runtime failed' }
          } finally { Pop-Location }
      - name: Validate corresponding source offline
        shell: pwsh
        run: |
          ./tools/run_clean_env.ps1 -FilePath cmake -CommandLine '-S source-stage/src/mw2renderer -B offline-build -G "Visual Studio 17 2022" -A x64 -DFETCHCONTENT_FULLY_DISCONNECTED=ON'
          if ($LASTEXITCODE) { throw 'Offline configuration failed' }
          ./tools/run_clean_env.ps1 -FilePath cmake -CommandLine '--build offline-build --config Release --target mw2renderer'
          if ($LASTEXITCODE) { throw 'Offline build failed' }
      - uses: actions/upload-artifact@v6
        with:
          name: native-release-candidate
          path: |
            dist/*.zip
            dist/*.sha256
            dist/sizes.json
          if-no-files-found: error
      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          $beta = [version]$version -lt [version]'1.0.0'
          $title = "MechWarrior 2 Enhanced Renderer Mod v$version"
          if ($beta) { $title += ' beta' }
          $title += ' (C++ renderer)'
          $notes = ".github/release-notes/v$version.md"
          if ((Get-Content $notes -Raw) -match 'unpublished candidate') {
            throw 'Finalize the release notes before publishing.'
          }
          $assets = @(Get-ChildItem dist -File | Where-Object Extension -in '.zip', '.sha256' | ForEach-Object FullName)
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$version" @assets
            if ($LASTEXITCODE) { throw 'Asset upload failed; existing assets are not overwritten' }
            gh release edit "v$version" --prerelease=$($beta.ToString().ToLowerInvariant()) --title $title --notes-file $notes
          } else {
            gh release create "v$version" @assets --verify-tag --prerelease=$($beta.ToString().ToLowerInvariant()) --title $title --notes-file $notes
          }
          if ($LASTEXITCODE) { throw 'Release publication failed' }
