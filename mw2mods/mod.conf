# This file is the shipped settings profile. Missing or invalid settings use
# the safe schema fallbacks declared in mod_init.py, which may intentionally
# differ. Setting help and constraints are generated from the same schema data
# available to configuration tools.

[renderer]
# Choose native scene rendering or four-sample SSAA. Choices: none, ssaa_4x.
antialiasing = ssaa_4x

# Set resolved scene-geometry line width while SSAA is active. Range: 0.5 to
# 8.0.
ssaa_line_width = 1.0

# Cap the main scene horizontal field of view on wide displays. Range: 30.0 to
# 170.0.
max_horizontal_fov_degrees = 105.0

# Select entity detail by projected size, native choice, or a forced detail
# level. Choices: native, projected_size, detail0, detail1, detail2, detail3.
entity_lod_selection = projected_size

# Set the projected-radius threshold for the highest entity detail. Range:
# 0.25 to 4096.0.
entity_lod_detail0_pixels = 16.0

# Set the projected-radius threshold for entity detail level 1. Range: 0.25 to
# 4096.0.
entity_lod_detail1_pixels = 10.0

# Set the projected-radius threshold for entity detail level 2. Range: 0.25 to
# 4096.0.
entity_lod_detail2_pixels = 5.0

# Set the fractional LOD threshold margin that prevents rapid detail
# switching. Range: 0.0 to 0.45.
entity_lod_hysteresis = 0.12

# Write renderer diagnostics and performance telemetry, including entity LOD
# decisions, to renderer_debug.log.
enable_diagnostic_logging = false

# Keep supported effects textured during enhanced imaging.
enhanced_enhanced_imaging = true

# Set enhanced-imaging visibility distance as a multiple of the native far
# distance. Range: 0.1 to 10.0.
enhanced_imaging_distance_ratio = 1.5

# Set the time for enhanced-imaging reveal to reach maximum distance. Range:
# 0.0 to 30.0.
enhanced_imaging_reveal_time = 0.3

# Replace helicopter rotor stand-ins with smooth motion-blurred rotors.
enhanced_heli_rotors = true

# Apply motion-blurred textures to enclosed aeroplane lift fans.
enhanced_aero_lift_fans = true

# Reposition known terrain blocks to reduce quantization seams.
reduce_terrain_gaps = true

# Use reconstructed seamless textures for known mech camouflage.
enhanced_mech_textures = true

# Use reconstructed seamless textures for known dropship surfaces.
enhanced_dropship_textures = true

# Set the texture frequency for reconstructed mech camouflage. Range: 0.125 to
# 16.0.
enhanced_mech_texture_uv_scale = 2.0

# Set the texture frequency for reconstructed dropship surfaces. Range: 0.125
# to 16.0.
enhanced_dropship_texture_uv_scale = 2.0

[HUD]
# Scale HUD positions from native layout toward viewport-height scaling.
# Range: 0.0 to 1.0.
position_scaling = 1.0

# Scale ordinary HUD artwork from native size toward viewport-height scaling.
# Range: 0.0 to 1.0.
panel_scaling = 0.6

# Scale camera panes from native size toward viewport-height scaling. Range:
# 0.0 to 1.0.
viewport_scaling = 1.0

# Scale renderer text from native size toward viewport-height scaling. Range:
# 0.0 to 1.0.
font_scaling = 0.6

# Scale the center reticle, NAV circle, and offscreen target arrows. Range:
# 0.0 to 1.0.
target_marker_scaling = 0.0

# Position middle HUD panels vertically, from the top (0) to the bottom (1) of
# the reference HUD area. Range: 0.0 to 1.0.
middle_panel_vertical_position = 0.550781

# Move top HUD panels from the centered 4:3 layout (0) toward the widescreen
# edges (1). Range: 0.0 to 1.0.
top_panel_widescreen_position = 0.5

# Move middle HUD panels from the centered 4:3 layout (0) toward the
# widescreen edges (1). Range: 0.0 to 1.0.
middle_panel_widescreen_position = 0.25

# Move bottom HUD panels from the centered 4:3 layout (0) toward the
# widescreen edges (1). Range: 0.0 to 1.0.
bottom_panel_widescreen_position = 0.0

# Choose native strips or corrected generated compass and altimeter rendering.
# Choices: native, enhanced.
compass_altimeter = enhanced

# Choose native bands or smooth live-palette power-meter shading. Choices:
# native, enhanced.
power_meters = enhanced

# Choose native bands or smooth live-palette armor-meter shading. Choices:
# native, enhanced.
htal_meters = enhanced

# Show the damage wireframe above lowered HTAL meters in the right MFD.
alt_htal_view = true

# Offset the dark palette shade used by enhanced meters. Range: -16 to 16.
meter_dark_offset = -2

# Offset the light palette shade used by enhanced meters. Range: -16 to 16.
meter_light_offset = -1

# Offset the highlight palette shade used by enhanced meters. Range: -16 to
# 16.
meter_peak_offset = 0

# Place the enhanced meter highlight within each filled segment. Range: 0.1 to
# 0.9.
meter_peak_position = 0.375

# Mirror the rear-camera image horizontally like a vehicle rear-view mirror.
rear_camera_mirror = true

# Place throttle, speed, and MASC in the alternate right-center layout.
alt_throttle_indicator_position = true

# Set antialiased radar-circle and field-of-view line thickness in output
# pixels. Range: 0.5 to 8.0.
radar_stroke_width = 1.5

[DEBUG]
# Cache resolved CEL pixels while continuing to resolve live descriptor state
# each frame.
cache_textures = true

# Skip mission-wide texture preload and load textures on demand.
disable_mission_texture_preload = false

# Cache parsed face topology while recomputing transforms and vertices.
cache_geometry_data = true

# Cache final geometry for blocks the game marks as static.
cache_static_geometry = true

# Reuse the first complete geometry snapshot for diagnostics.
reuse_geometry_after_first = false

# Continue extraction but stop refreshing GPU geometry after the first upload.
freeze_geometry_upload_after_first = false

# Skip enhanced geometry uploads to isolate extraction cost.
disable_geometry_upload = false

# Skip enhanced geometry drawing to isolate rendering cost.
disable_geometry_draw = false

# Suppress native main-scene geometry after a complete enhanced frame is
# available.
suppress_native_scene_raster = true

# Choose matrix-transformed local vertices or game-cached world vertices.
# Choices: matrix, cached.
entity_vertex_mode = matrix
