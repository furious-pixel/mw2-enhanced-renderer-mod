# Copy this file to joystick.conf and configure bindings for this computer.
# joystick.conf is intentionally ignored because device names and calibration
# are specific to each user.

[input]
# Enable joystick polling and applying joystick input to the game.
joystick_input_enable = false

# Choose direct stick-position aiming or relative rate aiming. Choices:
# direct, relative.
turret_aim_mode = direct

# Select the uniquely named SDL joystick used for turret yaw.
turret_yaw_device =

# Select the physical device axis used for turret yaw.
turret_yaw_axis = 0

# Select the uniquely named SDL joystick used for turret pitch.
turret_pitch_device =

# Select the physical device axis used for turret pitch.
turret_pitch_axis = 1

# Select the uniquely named SDL joystick used for chassis turn.
chassis_turn_device =

# Select the physical device axis used for chassis turn.
chassis_turn_axis = 2

# Select the uniquely named SDL joystick used for throttle.
throttle_device =

# Select the physical device axis used for throttle.
throttle_axis = 3

# Reverse the physical turret-yaw direction.
invert_turret_yaw = false

# Reverse the physical turret-pitch direction.
invert_turret_pitch = true

# Reverse the physical chassis-turn direction.
invert_chassis_turn = false

# Reverse the physical throttle direction before endpoint calibration.
invert_throttle = true

# Ignore small turret-yaw movement around the physical center. Range: 0.0 to
# 0.5.
turret_yaw_deadzone = 0.001

# Set the turret-yaw travel required to reach full calibrated input. Range:
# 0.05 to 1.0.
turret_yaw_input_saturation = 1.0

# Cap the maximum turret-yaw command produced by the axis. Range: 0.05 to 1.0.
turret_yaw_output_saturation = 1.0

# Ignore small turret-pitch movement around the physical center. Range: 0.0 to
# 0.5.
turret_pitch_deadzone = 0.001

# Set the turret-pitch travel required to reach full calibrated input. Range:
# 0.05 to 1.0.
turret_pitch_input_saturation = 1.0

# Cap the maximum turret-pitch command produced by the axis. Range: 0.05 to
# 1.0.
turret_pitch_output_saturation = 1.0

# Ignore small chassis-turn movement around the physical center. Range: 0.0 to
# 0.5.
chassis_turn_input_deadzone = 0.0

# Set the chassis-turn travel required to reach full calibrated input. Range:
# 0.05 to 1.0.
chassis_turn_input_saturation = 1.0

# Cap the maximum chassis-turn command produced by the axis. Range: 0.05 to
# 1.0.
chassis_turn_output_saturation = 1.0

# Choose the response curve used for direct turret yaw. Choices: linear,
# power, blended_curve.
direct_turret_yaw_curve_mode = blended_curve

# Set the power-curve blend used for direct turret yaw. Range: 0.0 to 1.0.
direct_turret_yaw_curve_k = 0.75

# Set the power exponent used for direct turret yaw. Range: 0.01 to 8.0.
direct_turret_yaw_curve_n = 1.7

# Choose the response curve used for direct turret pitch. Choices: linear,
# power, blended_curve.
direct_turret_pitch_curve_mode = blended_curve

# Set the power-curve blend used for direct turret pitch. Range: 0.0 to 1.0.
direct_turret_pitch_curve_k = 0.75

# Set the power exponent used for direct turret pitch. Range: 0.01 to 8.0.
direct_turret_pitch_curve_n = 1.7

# Set the turret-yaw target rate at full stick deflection. Range: 0.0 to
# 10000.0.
relative_turret_yaw_degrees_per_second = 256.0

# Set the turret-pitch target rate at full stick deflection. Range: 0.0 to
# 10000.0.
relative_turret_pitch_degrees_per_second = 256.0

# Choose the response curve used for relative turret yaw. Choices: linear,
# power, blended_curve.
relative_turret_yaw_curve_mode = linear

# Set the power-curve blend used for relative turret yaw. Range: 0.0 to 1.0.
relative_turret_yaw_curve_k = 0.75

# Set the power exponent used for relative turret yaw. Range: 0.01 to 8.0.
relative_turret_yaw_curve_n = 1.7

# Choose the response curve used for relative turret pitch. Choices: linear,
# power, blended_curve.
relative_turret_pitch_curve_mode = linear

# Set the power-curve blend used for relative turret pitch. Range: 0.0 to 1.0.
relative_turret_pitch_curve_k = 0.75

# Set the power exponent used for relative turret pitch. Range: 0.01 to 8.0.
relative_turret_pitch_curve_n = 1.7

# Set chassis-turn gain before the game's turn limit is applied. Range: 0.0 to
# 16.0.
chassis_turn_scale = 2.0

# Choose the response curve used for chassis turn. Choices: linear, power,
# blended_curve.
chassis_curve_mode = blended_curve

# Set the power-curve blend used for chassis turn. Range: 0.0 to 1.0.
chassis_curve_k = 0.75

# Set the power exponent used for chassis turn. Range: 0.01 to 8.0.
chassis_curve_n = 1.7

# Set the post-inversion raw throttle value that produces idle. Range: -32768
# to 32766.
throttle_raw_input_start = -32768

# Set the post-inversion raw throttle value that produces full input. Range:
# -32767 to 32767.
throttle_raw_input_end = 32767

# Cap the maximum throttle command produced by the axis. Range: 0.05 to 1.0.
throttle_output_saturation = 1.0

# Choose the response curve used across calibrated throttle travel. Choices:
# linear, power, blended_curve.
throttle_curve_mode = linear

# Set the power-curve blend used for throttle response. Range: 0.0 to 1.0.
throttle_curve_k = 0.75

# Set the power exponent used for throttle response. Range: 0.01 to 8.0.
throttle_curve_n = 1.7
